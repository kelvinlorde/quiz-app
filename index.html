<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>QuizApp</title>
</head>
<body>
    <div class="container">
        <!-- Start Screen -->
        <section id="start-screen" class="screen">
            <h1>Welcome to QuizApp</h1>
            <p>
        Test your knowledge with a short multiple-choice quiz.
        Answer each question and click "Next" to continue.
        Your score will be shown at the end.
            </p>
            <button id="start-btn" class="primary-btn">Start Quiz</button>
        </section>

         <!-- Quiz Screen -->
        <section id="quiz-screen" class="screen hidden">
            <div id="progress" class="progress">Question 1 of 1</div>
            <h2 id="question-text" class="question-text"></h2>
            <div id="choices" class="choices"></div>
            <button id="next-btn" class="primary-btn" disabled>Next</button>
        </section>

          <!-- Results Screen -->
        <section id="results-screen" class="screen hidden">
            <h1>Quiz Complete!</h1>
            <p id="score-display" class="score-display"></p>
            <p id="result-message" class="result-message"></p>
            <button id="restart-btn" class="primary-btn">Restart Quiz</button>
            </section>
    </div>
    <script src="./script.js"></script>
</html>
